<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">OpsWiki for Codex workflow</title>
  <desc id="desc">A local-first workflow diagram showing Markdown notes and infrastructure samples flowing through OpsWiki for Codex into context briefs, AGENTS.md, runbooks, static review reports, and MCP resources.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #dbe3ee; stroke-width: 2; rx: 8; }
      .title { font: 700 52px "Segoe UI", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .subtitle { font: 400 24px "Segoe UI", Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .col-title { font: 700 26px "Segoe UI", Arial, sans-serif; fill: #ffffff; letter-spacing: 0; }
      .label { font: 700 24px "Segoe UI", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .body { font: 400 21px "Segoe UI", Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .small { font: 600 18px "Segoe UI", Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .pill-text { font: 700 19px "Segoe UI", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .badge { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #ffffff; letter-spacing: 0; }
      .arrow { stroke: #334155; stroke-width: 5; fill: none; marker-end: url(#arrow); stroke-linecap: round; }
      .muted-line { stroke: #cbd5e1; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <circle cx="1430" cy="110" r="92" fill="#e0f2fe" opacity="0.9"/>
  <circle cx="125" cy="792" r="130" fill="#dcfce7" opacity="0.75"/>

  <text class="title" x="80" y="92">OpsWiki for Codex Workflow</text>
  <text class="subtitle" x="82" y="134">Turn local operational notes and infrastructure samples into Codex-ready context, runbooks, reviews, and MCP resources.</text>

  <g transform="translate(80 205)" filter="url(#shadow)">
    <rect class="card" width="400" height="438"/>
    <rect width="400" height="76" rx="8" fill="#0f766e"/>
    <path d="M0 68 H400 V86 H0 Z" fill="#0f766e"/>
    <text class="col-title" x="30" y="47">Inputs</text>

    <rect x="30" y="112" width="340" height="62" rx="8" fill="#ccfbf1" stroke="#5eead4"/>
    <text class="pill-text" x="54" y="150">Markdown notes</text>

    <rect x="30" y="194" width="340" height="62" rx="8" fill="#ecfdf5" stroke="#86efac"/>
    <text class="pill-text" x="54" y="232">Obsidian-style vault</text>

    <rect x="30" y="276" width="340" height="62" rx="8" fill="#fef3c7" stroke="#fbbf24"/>
    <text class="pill-text" x="54" y="314">Terraform / Kubernetes samples</text>

    <line class="muted-line" x1="30" y1="368" x2="370" y2="368"/>
    <text class="body" x="30" y="404">Local files stay local.</text>
  </g>

  <path class="arrow" d="M515 424 C555 424, 565 424, 598 424"/>

  <g transform="translate(600 205)" filter="url(#shadow)">
    <rect class="card" width="400" height="438"/>
    <rect width="400" height="76" rx="8" fill="#1d4ed8"/>
    <path d="M0 68 H400 V86 H0 Z" fill="#1d4ed8"/>
    <text class="col-title" x="30" y="47">OpsWiki Core</text>

    <rect x="30" y="106" width="340" height="154" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text class="label" x="58" y="154">OpsWiki for Codex</text>
    <text class="body" x="58" y="190">Skills + references</text>
    <text class="body" x="58" y="224">Helper scripts</text>

    <rect x="30" y="288" width="340" height="62" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
    <text class="pill-text" x="54" y="326">Read-only MCP server</text>

    <line class="muted-line" x1="30" y1="378" x2="370" y2="378"/>
    <text class="body" x="30" y="414">Deterministic, reviewable outputs.</text>
  </g>

  <path class="arrow" d="M1035 424 C1075 424, 1085 424, 1118 424"/>

  <g transform="translate(1120 205)" filter="url(#shadow)">
    <rect class="card" width="400" height="438"/>
    <rect width="400" height="76" rx="8" fill="#7c3aed"/>
    <path d="M0 68 H400 V86 H0 Z" fill="#7c3aed"/>
    <text class="col-title" x="30" y="47">Outputs</text>

    <rect x="30" y="104" width="340" height="52" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text class="pill-text" x="54" y="137">Context Brief</text>

    <rect x="30" y="168" width="340" height="52" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text class="pill-text" x="54" y="201">AGENTS.md</text>

    <rect x="30" y="232" width="340" height="52" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text class="pill-text" x="54" y="265">Operational Runbook</text>

    <rect x="30" y="296" width="340" height="52" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text class="pill-text" x="54" y="329">Static Review Report</text>

    <rect x="30" y="360" width="340" height="52" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text class="pill-text" x="54" y="393">MCP Resources</text>
  </g>

  <g transform="translate(180 705)">
    <rect width="1240" height="112" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="28" y="30" width="136" height="44" rx="8" fill="#0f766e"/>
    <text class="badge" x="55" y="58">Local-first</text>

    <rect x="190" y="30" width="168" height="44" rx="8" fill="#1d4ed8"/>
    <text class="badge" x="219" y="58">Read-only MCP</text>

    <rect x="384" y="30" width="235" height="44" rx="8" fill="#475569"/>
    <text class="badge" x="412" y="58">No external execution</text>

    <text class="small" x="650" y="58">No cloud, cluster, CI, or shell execution by default.</text>
  </g>
</svg>
