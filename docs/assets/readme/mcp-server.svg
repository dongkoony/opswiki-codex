<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Optional MCP server workflow</title>
  <desc id="desc">A diagram showing the optional local MCP server exposing read-only OpsWiki tools and resources for generated outputs and source notes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #dbe3ee; stroke-width: 2; rx: 8; }
      .title { font: 700 52px "Segoe UI", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .subtitle { font: 400 24px "Segoe UI", Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .head { font: 700 26px "Segoe UI", Arial, sans-serif; fill: #ffffff; letter-spacing: 0; }
      .label { font: 700 22px "Segoe UI", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .body { font: 400 20px "Segoe UI", Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .code { font: 600 18px "Consolas", "Cascadia Mono", monospace; fill: #334155; letter-spacing: 0; }
      .badge { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #ffffff; letter-spacing: 0; }
      .arrow { stroke: #334155; stroke-width: 5; fill: none; marker-end: url(#arrow); stroke-linecap: round; }
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <circle cx="1410" cy="116" r="96" fill="#e0f2fe" opacity="0.85"/>
  <circle cx="145" cy="760" r="122" fill="#ede9fe" opacity="0.75"/>

  <text class="title" x="80" y="94">Optional MCP Server</text>
  <text class="subtitle" x="82" y="136">Expose generated outputs and source notes to Codex through local read-only MCP tools and resources.</text>

  <g transform="translate(80 208)" filter="url(#shadow)">
    <rect class="card" width="430" height="452"/>
    <rect width="430" height="76" rx="8" fill="#0f766e"/>
    <path d="M0 68 H430 V86 H0 Z" fill="#0f766e"/>
    <text class="head" x="30" y="47">Local Repository Files</text>
    <rect x="30" y="110" width="370" height="62" rx="8" fill="#ccfbf1" stroke="#5eead4"/>
    <text class="label" x="54" y="149">examples/sample-output/*.md</text>
    <rect x="30" y="194" width="370" height="62" rx="8" fill="#ecfdf5" stroke="#86efac"/>
    <text class="label" x="54" y="233">examples/sample-obsidian-vault/*.md</text>
    <rect x="30" y="278" width="370" height="62" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text class="label" x="54" y="317">.mcp.json</text>
    <text class="body" x="30" y="390">Repository-root confined reads.</text>
    <text class="body" x="30" y="424">No arbitrary filesystem access.</text>
  </g>

  <path class="arrow" d="M546 434 C590 434, 610 434, 646 434"/>

  <g transform="translate(646 235)" filter="url(#shadow)">
    <rect class="card" width="308" height="398"/>
    <rect width="308" height="76" rx="8" fill="#1d4ed8"/>
    <path d="M0 68 H308 V86 H0 Z" fill="#1d4ed8"/>
    <text class="head" x="28" y="47">FastMCP Server</text>
    <rect x="28" y="112" width="252" height="78" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text class="code" x="48" y="145">mcp/opswiki</text>
    <text class="code" x="48" y="171">_server.py</text>
    <rect x="28" y="214" width="252" height="54" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
    <text class="label" x="50" y="249">Read guards</text>
    <text class="body" x="28" y="312">UTF-8 validation</text>
    <text class="body" x="28" y="344">size limits</text>
    <text class="body" x="28" y="376">hidden path rejection</text>
  </g>

  <path class="arrow" d="M990 434 C1034 434, 1054 434, 1088 434"/>

  <g transform="translate(1088 190)" filter="url(#shadow)">
    <rect class="card" width="432" height="488"/>
    <rect width="432" height="76" rx="8" fill="#7c3aed"/>
    <path d="M0 68 H432 V86 H0 Z" fill="#7c3aed"/>
    <text class="head" x="30" y="47">Codex MCP Access</text>
    <rect x="30" y="106" width="372" height="48" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text class="label" x="54" y="137">list_opswiki_outputs</text>
    <rect x="30" y="166" width="372" height="48" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text class="label" x="54" y="197">read_opswiki_output</text>
    <rect x="30" y="226" width="372" height="48" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text class="label" x="54" y="257">list_opswiki_notes</text>
    <rect x="30" y="286" width="372" height="48" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text class="label" x="54" y="317">read_opswiki_note</text>
    <rect x="30" y="366" width="372" height="54" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
    <text class="label" x="54" y="400">opswiki://outputs · opswiki://notes</text>
    <text class="body" x="30" y="456">Structured, read-only context for Codex.</text>
  </g>

  <g transform="translate(210 728)">
    <rect width="1180" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="28" y="26" width="160" height="44" rx="8" fill="#0f766e"/>
    <text class="badge" x="58" y="54">Local files</text>
    <rect x="214" y="26" width="178" height="44" rx="8" fill="#1d4ed8"/>
    <text class="badge" x="243" y="54">Read-only server</text>
    <rect x="418" y="26" width="235" height="44" rx="8" fill="#475569"/>
    <text class="badge" x="447" y="54">No shell execution</text>
    <text class="body" x="685" y="54">MCP reads existing content; it does not mutate files.</text>
  </g>
</svg>
