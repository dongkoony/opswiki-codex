name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Check whitespace
        run: git diff --check

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate plugin manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(".")
          manifest_path = root / ".codex-plugin" / "plugin.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          required_top_level = {
              "name",
              "version",
              "description",
              "author",
              "license",
              "keywords",
              "skills",
              "interface",
          }
          missing = sorted(required_top_level - manifest.keys())
          if missing:
              raise SystemExit(f"Missing manifest fields: {missing}")

          if manifest["name"] != "opswiki-codex":
              raise SystemExit("Manifest name must remain opswiki-codex.")
          if manifest["skills"] != "./skills/":
              raise SystemExit("Manifest skills path must remain ./skills/.")
          if not (root / "skills").is_dir():
              raise SystemExit("Manifest skills path does not exist.")

          if "mcpServers" in manifest and not (root / ".mcp.json").is_file():
              raise SystemExit("mcpServers requires .mcp.json.")
          if "apps" in manifest and not (root / ".app.json").is_file():
              raise SystemExit("apps requires .app.json.")

          forbidden = ("[TODO:", "Generated by Codex", "AI-generated", "Co-authored-by")
          manifest_text = manifest_path.read_text(encoding="utf-8")
          for phrase in forbidden:
              if phrase in manifest_text:
                  raise SystemExit(f"Forbidden manifest phrase found: {phrase}")
          PY
